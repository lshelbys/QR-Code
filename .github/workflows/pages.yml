name: Build GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/qr-code/index.html"
      - "tools/qr-code/404.html"
      - "tools/qr-code/assets/**"
      - "tools/qr-code/.nojekyll"
      - "tools/qr-code/favicon.svg"
      - "tools/background-remover/index.html"
      - "tools/background-remover/404.html"
      - "tools/background-remover/assets/**"
      - "tools/background-remover/.nojekyll"
      - "tools/background-remover/favicon.svg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            tools/qr-code/pnpm-lock.yaml
            tools/background-remover/pnpm-lock.yaml
      - name: Build QR tool
        working-directory: tools/qr-code
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:pages
      - name: Build background remover
        working-directory: tools/background-remover
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:pages
      - name: Commit Pages files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/qr-code/index.html tools/qr-code/404.html tools/qr-code/.nojekyll tools/qr-code/favicon.svg tools/qr-code/assets
          git add tools/background-remover/index.html tools/background-remover/404.html tools/background-remover/.nojekyll tools/background-remover/favicon.svg tools/background-remover/assets
          if git diff --staged --quiet; then
            echo "No Pages file changes"
          else
            git commit -m "Update GitHub Pages tool builds [skip ci]"
            git push
          fi
