<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="qr studio — create, style, and export QR codes in your browser. Free static codes with full design controls." />
    <title>qr studio — QR Code Generator</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        document.documentElement.removeAttribute("data-theme");
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("js");
        window.addEventListener("DOMContentLoaded", function () {
          setTimeout(function () {
            if (document.body) document.body.classList.add("is-ready");
          }, 2500);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
